<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>IKSM HUB</title>
  <meta name="description" content="IKSM HUB：浏览主分支上的知识主题、Marp 胶片与导出 HTML。输出才通透，共享才拥有。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23031833'/%3E%3Cpath d='M8 22 L16 7 L24 22' fill='none' stroke='%237ee7ff' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='18' r='2.2' fill='%233d8bff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hub/styles.css">
</head>
<body>
  <a class="skip" href="#catalog">跳到目录</a>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>
  <div class="veil" aria-hidden="true"></div>

  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot-core">
      <div class="boot-ring"></div>
      <div class="boot-ring delay"></div>
      <b>IKSM</b>
    </div>
    <p id="boot-text">正在读取主分支目录…</p>
  </div>

  <div class="shell">
    <header class="hero">
      <p class="kicker"><span class="pulse" aria-hidden="true"></span>master · 知识 → 胶片 → 导出</p>
      <h1 class="title-glow">IKSM HUB</h1>
      <p class="subtitle">输出才通透，共享才拥有。</p>
      <div class="flow" aria-label="知识转化流水线">
        <span>iksm 知识源</span>
        <i aria-hidden="true"></i>
        <span>marp 胶片</span>
        <i aria-hidden="true"></i>
        <span>output 导出</span>
      </div>
      <dl class="stats" id="stats"></dl>
    </header>

    <main id="catalog">
      <div class="toolbar">
        <div class="tabs" role="tablist" aria-label="内容分类">
          <button type="button" id="tab-themes" role="tab" aria-selected="true" aria-controls="panel-themes">知识主题</button>
          <button type="button" id="tab-decks" role="tab" aria-selected="false" aria-controls="panel-decks">演示 / 导出</button>
        </div>
        <label class="search">
          <span class="sr">筛选标题或路径</span>
          <input id="query" type="search" placeholder="筛选标题或路径" autocomplete="off">
        </label>
      </div>

      <section id="panel-themes" role="tabpanel" aria-labelledby="tab-themes" tabindex="0"></section>
      <section id="panel-decks" role="tabpanel" aria-labelledby="tab-decks" tabindex="0" hidden></section>
    </main>

    <footer class="colophon">
      <p>静态浏览页。清单来自 <code>hub/catalog.json</code>，对应主分支上的真实目录。</p>
      <p>页面内用相对路径打开 Markdown 与 HTML。若在 GitHub 原始文件页打不开，可加前缀 <code>https://htmlpreview.github.io/?</code> 作为兜底。</p>
    </footer>
  </div>

  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-bar">
      <div class="viewer-heading">
        <p id="viewer-kicker" class="viewer-kicker"></p>
        <h2 id="viewer-title"></h2>
        <p id="viewer-path" class="viewer-path"></p>
      </div>
      <button type="button" id="viewer-close" class="icon-btn">关闭</button>
    </div>
    <div class="viewer-tools">
      <div id="mode-switch" class="seg" role="group" aria-label="Markdown 查看方式">
        <button type="button" id="mode-source" aria-pressed="true">源码</button>
        <button type="button" id="mode-render" aria-pressed="false">渲染</button>
      </div>
      <p id="viewer-meta" class="viewer-meta"></p>
      <div class="viewer-links">
        <button type="button" id="copy-src" hidden>复制源码</button>
        <a id="link-blank" target="_blank" rel="noopener">新窗口</a>
        <a id="link-preview" target="_blank" rel="noopener">htmlpreview 兜底</a>
        <a id="link-github" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
    <p id="viewer-hint" class="viewer-hint" hidden></p>
    <div class="viewer-stage">
      <div id="stage-loading" class="stage-loading" hidden>
        <span class="mini-ring" aria-hidden="true"></span>
        <span>正在载入…</span>
      </div>
      <pre id="stage-source" class="source" hidden></pre>
      <iframe id="stage-frame" title="内容视图" hidden allow="fullscreen" allowfullscreen></iframe>
      <p id="stage-error" class="stage-error" hidden></p>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="hub/app.js"></script>
</body>
</html>
