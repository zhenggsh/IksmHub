<div class="title"><span class="no">00</span>这是什么</div>
<div class="gist">知识通（仓库名 <em>math</em>）给高中数学用。教师用文件维护教材大纲和讲解，学生按大纲学习并留下掌握反馈，系统据此做针对性推荐和学习分析。</div>
<div class="content">
<div class="grid">
  <div class="card">
    <h4>教师维护文件</h4>
    <p>教材大纲和讲解放在文件里。</p>
    <p>框架是 xlsx 或 csv，详情是 Markdown。</p>
  </div>
  <div class="card g">
    <h4>学生按大纲学</h4>
    <p>学习时留下掌握反馈。</p>
    <p>记录只追加，供后面的分析使用。</p>
  </div>
  <div class="card p">
    <h4>推荐与分析</h4>
    <p>系统按反馈做针对性推荐。</p>
    <p>也做学习分析。本文讲到本地怎么跑起来。</p>
  </div>
</div>
</div>
<div class="note"><b>只讲 mydoc/math_intro.md。</b>胶片版本是 v1.0.0。上游 commit ca118bf，提交说明 intro3，2026-11-17 21:07 Asia/Shanghai。</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:default;" data-marpit-pagination-total="39" data-size="16:9">
<div class="title"><span class="no">00</span>内容地图</div>
<div class="gist">顺序跟上游：设计背景、设计理念、主要模块、系统架构、运行方式。十一段 mermaid 在知识源里保留源码，胶片上是按原文渲出的图。</div>
<div class="content">
<div class="vlist">
  <div class="grid" style="height:auto;">
    <div class="card"><h4>01 设计背景</h4><p>知识要有稳定载体，过程要记下来，路径可以选择，教与学分开。题库组卷和自动阅卷不在职责内。</p></div>
    <div class="card g"><h4>02 设计理念</h4><p>文件是知识源，数据库是索引和用户数据。前后端分离。目录用 Excel，知识用 Markdown。</p></div>
    <div class="card p"><h4>03 主要模块</h4><p>认证、教材、学习、智能学习、分析、学习助手。六张界面图按上游引用放进来。</p></div>
  </div>
  <div class="grid" style="height:auto;">
    <div class="card"><h4>04 系统架构</h4><p>前端 5173，后端 3000。一次学习反馈的时序、入库、目录、技术栈和数据结构。</p></div>
    <div class="card o"><h4>05 运行方式</h4><p>Node、pnpm、PostgreSQL。环境变量、启动命令、常用指令，以及本地使用顺序。</p></div>
    <div class="card r"><h4>不写成已交付</h4><p>题库组卷、自动阅卷保持为非职责。§5.2 的演示账号只按原文出现，不扩成账号体系。</p></div>
  </div>
</div>

<div class="title"><span class="no">01</span>讲解散落，大纲对不齐</div>
<div class="gist">高中数学知识点多、层级深。课堂讲解和课后复习散落在课件、笔记和题解里，学生很难按同一套大纲持续学，教师也难看清学了多久、掌握到哪一级。</div>
<div class="content">
<div class="grid">
  <div class="card">
    <h4>知识有稳定载体</h4>
    <p>每本教材是一对同名文件。</p>
    <p>框架（xlsx 或 csv）写三级提纲，详情（md）写定义、公式、定理和关系图。</p>
    <p>两边用编号对齐，例如 <b>1.1.1</b>。</p>
  </div>
  <div class="card g">
    <h4>学习过程可记录</h4>
    <p>浏览知识点时记下开始时间、学习时长、备注和掌握程度（A–E）。</p>
    <p>记录只追加。</p>
  </div>
  <div class="card p">
    <h4>路径可选择</h4>
    <p>可以按大纲自由点选。</p>
    <p>也可以按薄弱点、重要性或随机抽取来学。</p>

<div class="title"><span class="no">02</span>三条设计理念</div>
<div class="gist">文件放正文，数据库放索引和用户数据。浏览器只走 REST。目录和知识分成两级：Excel 放目录，Markdown 放知识。</div>

<div class="grid">

  </div>
  <div class="card g">
    <h4>2.2 前后端分离</h4>
    <p>前端管界面、路由和本地交互状态。</p>

  </div>
  <div class="card p">
    <h4>2.3 两级存储</h4>

  </div>
</div>
</div>
<div class="note"><b>刷新或同步时</b>按文件变更把框架重新解析进数据库，并与 Markdown 详情保持编号一致。</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="shot" data-theme="default" lang="en-US" class="shot" data-marpit-pagination="7" style="--paginate:true;--class:shot;--theme:default;" data-marpit-pagination-total="39" data-size="16:9"><div class="title"><span class="no">02</span>文件、索引、界面</div>

<div class="title"><span class="no">02</span>目录文件和详情文件</div>
<div class="gist">§2.3 的提示词示例，任务是整理「高中数学必修一」。产出两份文件，用知识点编号对齐。下面只列提示词里写明的要求。</div>
<div class="content">
<div class="cols">
  <div class="col-l card">
    <h4>框架 · math01.xlsx</h4>
    <ul class="tight">
      <li>输出到 <b>~/iksm/math01.xlsx</b>，同一张表，表头前无空行</li>
      <li>三级树。一级、二级也各占一行，单元格不合并</li>
      <li>字段：一级、二级、三级、定义、特性、重要性 A/B/C、编号</li>
      <li>编号遵守 <b>a / a.b / a.b.c</b></li>
      <li>文字里的逗号用中文全角，避免和 csv 逗号冲突</li>
    </ul>
  </div>
  <div class="col-r card p">
    <h4>详情 · math01.md</h4>
    <ul class="tight">
      <li>Markdown。公式用 LaTeX，关系图用 mermaid</li>
      <li>一级 <b>##</b>，二级 <b>###</b>，三级 <b>####</b></li>
      <li>含编号、定义、重要性、特性、运算方式、定理、公式、二级结论</li>
      <li>编号与 xlsx 一一对应</li>
    </ul>
  </div>
</div>
</div>
<div class="note"><b>这是生成知识文件的提示词。</b>不是题库组卷。提示词全文、转义和角色说明都在 iksm 原文的代码块里。</div>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:default;" data-marpit-pagination-total="39" data-size="16:9">

</div>
</div>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:default;" data-marpit-pagination-total="39" data-size="16:9">

  </div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-class="shot" data-theme="default" lang="en-US" class="shot" data-marpit-pagination="30" style="--paginate:true;--class:shot;--theme:default;" data-marpit-pagination-total="39" data-size="16:9"><div class="title"><span class="no">04</span>核心实体</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:default;" data-marpit-pagination-total="39" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="shot" data-theme="default" lang="en-US" class="shot" data-marpit-pagination="32" style="--paginate:true;--class:shot;--theme:default;" data-marpit-pagination-total="39" data-size="16:9"><div class="title"><span class="no">04</span>两套分级不要混</div>
<div class="gist">重要性 A/B/C 用来筛选推荐。掌握程度 C、D、E 视为薄弱。两套都用字母，含义不同。</div>

  <div class="grid" style="height:auto;">
    <div class="card slim"><h4>一级知识点 · level1</h4><p>必填，可从上一行继承。</p></div>

    <div class="card slim"><h4>三级知识点 · level3</h4><p>可空，可继承。</p></div>
  </div>
  <div class="grid" style="height:auto;">
    <div class="card slim g"><h4>定义 · definition</h4><p>简要定义。</p></div>
    <div class="card slim g"><h4>特性 / 运算方式 · characteristics</h4><p>特性或运算要点。</p></div>
    <div class="card slim p"><h4>知识点编号 · code</h4><p>1、1.1、1.1.1。</p></div>
  </div>

</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:default;" data-marpit-pagination-total="39" data-size="16:9">
<div class="title"><span class="no">05</span>准备环境</div>
<div class="gist">命令都在仓库根目录执行。需要 Node.js 18+、pnpm 8+，以及本机可访问的 PostgreSQL 14+。</div>
<div class="content">
<div class="cols">
  <div class="col-l">
<pre class="spec">pnpm install
Copy-Item server\.env.example server\.env
Copy-Item web\.env.example web\.env
<p>pnpm --filter server prisma migrate dev<br />
pnpm --filter server prisma generate</pre></p>
  </div>
  <div class="col-r vlist">
    <div class="card slim"><h4>教材成对放入 iksm/</h4><p>同一主文件名，例如 math01.xlsx 与 math01.md。</p></div>
    <div class="card slim o"><h4>会被忽略</h4><p>以 . 、_ 、tmp 开头的文件。入库流程里还忽略非 xlsx、csv、md。</p></div>
    <div class="card slim g"><h4>web/.env</h4><p>VITE_API_BASE_URL 默认为 http://localhost:3000。</p></div>
  </div>
</div>
</div>
<div class="note"><b>上面是 PowerShell，按上游原文。</b>server/.env 的变量在下一页。</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:default;" data-marpit-pagination-total="39" data-size="16:9">
<div class="title"><span class="no">05</span>server/.env</div>
<div class="gist">库名示例是 <em>mathtong</em>。不用学习助手时，Kimi 三项可以保留占位。生产环境必须更换 JWT_SECRET。</div>
<div class="content">
<div class="vlist">
  <div class="card slim"><h4>DATABASE_URL</h4><p>PostgreSQL 连接串，库名示例为 mathtong。</p></div>
  <div class="card slim"><h4>JWT_SECRET</h4><p>签发登录令牌的密钥，生产环境必须更换。</p></div>
  <div class="card slim g"><h4>JWT_EXPIRES_IN</h4><p>令牌有效期，默认 24h。</p></div>
  <div class="card slim"><h4>PORT</h4><p>后端端口，默认 3000。</p></div>
  <div class="card slim p"><h4>IKSM_DIR</h4><p>教材目录的绝对路径，指向本仓库的 iksm。</p></div>
  <div class="card slim o"><h4>KIMI_BASE_URL / KIMI_API_KEY / KIMI_MODEL</h4><p>学习助手所用的模型接口；不使用助手时可保留占位。</p></div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:default;" data-marpit-pagination-total="39" data-size="16:9">
<div class="title"><span class="no">05</span>启动</div>
<div class="gist">开两个终端，分别启动后端和前端。括号里的账号按 §5.2 原文列出，这里不把它写成账号体系设计。</div>
<div class="content">
<div class="cols">
  <div class="col-l vlist">
    <div class="card slim"><h4>pnpm dev:server</h4><p>一个终端启动后端。</p></div>
    <div class="card slim g"><h4>pnpm dev</h4><p>另一个终端启动前端。</p></div>
    <div class="card slim o"><h4>原文括号</h4><p>teacher@test.com/password123,qa-test@example.com/password123</p></div>
  </div>
  <div class="col-r card">
    <h4>三个地址</h4>
    <ul class="tight">
      <li><b>localhost:5173</b> 前端</li>
      <li><b>localhost:3000</b> 后端</li>
      <li><b>localhost:3000/api</b> Swagger</li>
    </ul>
    <p>打开前端后注册学生账号，或使用已有教师账号进入教材管理，执行同步，即可在学习页看到知识点。</p>
  </div>
</div>
</div>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:default;" data-marpit-pagination-total="39" data-size="16:9">
<div class="title"><span class="no">05</span>常用指令</div>
<div class="gist">根目录同时管两端。只跑一端时加过滤器，例如 pnpm --filter web test --run，或指定 textbook.service.spec.ts。</div>
<div class="content">
<div class="cols">
  <div class="col-l card">
    <h4>根目录</h4>
    <ul class="tight">
      <li><b>pnpm dev</b> 启动前端开发服务器</li>
      <li><b>pnpm dev:server</b> 启动后端并监听文件变化</li>
      <li><b>pnpm build</b> 构建前端和后端</li>
      <li><b>pnpm typecheck</b> 两端 TypeScript 检查</li>
      <li><b>pnpm lint</b> 两端 ESLint</li>
      <li><b>pnpm format</b> 两端 Prettier 格式化</li>
      <li><b>pnpm test</b> 前端 Vitest 与后端 Jest</li>
    </ul>
  </div>
  <div class="col-r card g">
    <h4>数据库</h4>
    <ul class="tight">
      <li><b>prisma migrate dev</b> 开发环境执行迁移</li>
      <li><b>prisma generate</b> 重新生成 Prisma Client</li>
      <li><b>prisma studio</b> 打开数据库可视化界面</li>
    </ul>

  </div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-class="shot" data-theme="default" lang="en-US" class="shot" data-marpit-pagination="38" style="--paginate:true;--class:shot;--theme:default;" data-marpit-pagination-total="39" data-size="16:9"><div class="title"><span class="no">05</span>本地使用顺序</div>
